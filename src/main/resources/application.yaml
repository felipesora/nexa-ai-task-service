server:
  port: 8082

spring:
  application:
    name: nexa-task
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/nexa_task?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE